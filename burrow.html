<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rabbit Hole — Colony View</title>
    <link rel="stylesheet" href="burrow.css" />
  </head>
  <body>
    <header class="sky">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="burrow-counter" id="burrowCounter">Burrow 0 of 0</div>

      <div class="signpost-wrap">
        <div class="signpost" id="signpost"></div>
        <div class="sign-post-stem"></div>
      </div>

      <div class="grass"></div>
    </header>

    <main class="soil">
      <div class="colony-stage">
        <button
          class="side-arrow"
          id="prevBurrowBtn"
          title="Previous Burrow (←)"
        >
          ◀
        </button>
        <section class="tunnel" id="tunnelMap"></section>
        <button class="side-arrow" id="nextBurrowBtn" title="Next Burrow (→)">
          ▶
        </button>
      </div>
    </main>

    <script src="burrow.js"></script>
  </body>
</html>
